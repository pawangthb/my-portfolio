services:
  - type: web
    name: portfolio-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
